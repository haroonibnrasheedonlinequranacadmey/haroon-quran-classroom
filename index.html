<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haroon Ibn Rasheed Online Quran Academy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#202124;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

/* TOP */
.topbar{
  height:64px;
  background:#ffffff;
  color:#17324d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:700;
  letter-spacing:.2px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  position:relative;
  z-index:20;
}

/* VIDEO AREA */
.video-area{
  height:calc(100vh - 64px);
  padding:18px 18px 100px;
  overflow:auto;
}

.video-grid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  grid-auto-rows:minmax(190px,1fr);
  gap:12px;
  align-content:center;
}

.empty-message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#b8b8b8;
  text-align:center;
  font-size:15px;
}

/* VIDEO TILE */
.tile{
  background:#303134;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  min-height:190px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);
}

.tile video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#111;
}

.tile-name{
  position:absolute;
  left:10px;
  bottom:10px;
  background:rgba(0,0,0,.65);
  padding:7px 10px;
  border-radius:8px;
  font-size:14px;
  z-index:2;
}

.tile-status{
  position:absolute;
  right:10px;
  bottom:10px;
  display:flex;
  gap:5px;
  z-index:2;
}

.status-icon{
  background:rgba(0,0,0,.65);
  border-radius:50%;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

/* JOIN SCREEN */
.join-screen{
  position:fixed;
  inset:0;
  background:rgba(20,20,20,.96);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.join-box{
  width:min(420px,100%);
  background:white;
  color:#222;
  border-radius:18px;
  padding:30px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
  text-align:center;
}

.join-box h2{
  color:#17324d;
  margin-bottom:8px;
}

.join-box p{
  color:#666;
  font-size:14px;
  margin-bottom:22px;
}

.join-box input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  margin-bottom:12px;
  outline:none;
}

.join-box input:focus{
  border-color:#17324d;
}

.join-btn{
  width:100%;
  border:0;
  background:#17324d;
  color:white;
  padding:13px;
  border-radius:9px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

/* BOTTOM CONTROLS */
.controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:rgba(35,35,35,.96);
  padding:9px 14px;
  border-radius:40px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:50;
  box-shadow:0 5px 25px rgba(0,0,0,.45);
}

.control{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#3c4043;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:.15s;
}

.control:hover{
  background:#55595d;
  transform:scale(1.05);
}

.control svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.control.off{
  background:#ea4335;
}

.control.active{
  background:#1a73e8;
}

/* TOOLTIP */
.control::after{
  content:attr(data-tip);
  position:absolute;
  bottom:59px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:6px 9px;
  border-radius:6px;
  font-size:12px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

.control:hover::after{
  opacity:1;
}

/* CHAT */
.chat-panel{
  position:fixed;
  left:14px;
  top:78px;
  bottom:90px;
  width:320px;
  background:white;
  color:#222;
  border-radius:14px;
  box-shadow:0 5px 25px rgba(0,0,0,.4);
  z-index:40;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transform:translateX(-350px);
  transition:.25s ease;
}

.chat-panel.open{
  transform:translateX(0);
}

.chat-head{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #ddd;
  font-weight:bold;
}

.close-chat{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
  color:#555;
}

.messages{
  flex:1;
  overflow:auto;
  padding:12px;
}

.message{
  background:#f1f3f4;
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:8px;
  font-size:14px;
  word-break:break-word;
}

.message strong{
  display:block;
  margin-bottom:3px;
  color:#17324d;
}

.chat-input{
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
  gap:7px;
}

.chat-input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.chat-input button{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#17324d;
  color:white;
  cursor:pointer;
}

/* TOAST */
.toast{
  position:fixed;
  top:78px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:white;
  color:#222;
  padding:10px 17px;
  border-radius:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:80;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */
@media(max-width:650px){
  .topbar{
    height:58px;
    font-size:16px;
    padding:0 10px;
    text-align:center;
  }

  .video-area{
    height:calc(100vh - 58px);
    padding:10px 10px 90px;
  }

  .video-grid{
    grid-template-columns:1fr;
    grid-auto-rows:220px;
  }

  .controls{
    bottom:10px;
    padding:7px 9px;
    gap:6px;
  }

  .control{
    width:43px;
    height:43px;
  }

  .chat-panel{
    width:calc(100% - 28px);
    top:70px;
    bottom:78px;
  }
}
</style></head><body><!-- TOP --><div class="topbar">
  Haroon Ibn Rasheed Online Quran Academy
</div><!-- VIDEOS --><div class="video-area">
  <div id="videoGrid" class="video-grid"></div>
  <div id="emptyMessage" class="empty-message">
    Waiting for students to join...
  </div>
</div><!-- CHAT PANEL --><div id="chatPanel" class="chat-panel">
  <div class="chat-head">
    <span>Classroom Chat</span>
    <button class="close-chat" onclick="toggleChat()">×</button>
  </div>  <div id="messages" class="messages"></div>  <div class="chat-input">
    <input id="chatInput" type="text" placeholder="Type a message...">
    <button onclick="sendChat()">➤</button>
  </div>
</div><!-- BOTTOM CONTROLS --><div class="controls">  <!-- CAMERA --><button id="cameraBtn"
class="control"
data-tip="Camera"
onclick="toggleCamera()">
<svg viewBox="0 0 24 24">
<path d="M15 10l4.5-3v10L15 14z"></path>
<rect x="3" y="6" width="12" height="12" rx="2"></rect>
</svg>
</button>

  <!-- MICROPHONE --><button id="micBtn"
class="control"
data-tip="Microphone"
onclick="toggleMic()">
<svg viewBox="0 0 24 24">
<rect x="8" y="3" width="8" height="12" rx="4"></rect>
<path d="M5 11a7 7 0 0 0 14 0"></path>
<path d="M12 18v3"></path>
<path d="M9 21h6"></path>
</svg>
</button>

  <!-- SCREEN SHARE --><button id="screenBtn"
class="control"
data-tip="Screen Share"
onclick="toggleScreen()">
<svg viewBox="0 0 24 24">
<rect x="3" y="4" width="18" height="14" rx="2"></rect>
<path d="M8 21h8"></path>
<path d="M12 18v3"></path>
</svg>
</button>

  <!-- CHAT --><button id="chatBtn"
class="control"
data-tip="Chat"
onclick="toggleChat()">
<svg viewBox="0 0 24 24">
<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-10.5A7.5 7.5 0 0 1 10.5 4H12.5A7.5 7.5 0 0 1 20 11.5z"></path>
</svg>
</button>

</div><!-- JOIN SCREEN --><div id="joinScreen" class="join-screen">
  <div class="join-box">
    <h2>Online Quran Classroom</h2>
    <p>Enter your name to join the class</p><input id="nameInput"
       type="text"
       placeholder="Your Name"
       maxlength="40">

<button class="join-btn" onclick="joinClass()">
  Join Class
</button>

  </div>
</div><!-- JOIN NOTIFICATION --><div id="toast" class="toast"></div><script>

/* =========================================================
   SUPABASE SETTINGS
   ========================================================= */

const SUPABASE_URL =
"https://haetymgmvotqfyvqwogq.supabase.co";

/*
===========================================================
sb_publishable_RdrOGrd2Ov8vxFJPGCvzFA_m7a_4Wo8
===========================================================
*/

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================================================
   VARIABLES
   ========================================================= */

let localStream = null;
let screenStream = null;

let cameraOn = true;
let micOn = true;
let screenOn = false;

let myName = "";
let myId = crypto.randomUUID();

const room =
new URLSearchParams(location.search).get("room") ||
"quran-class";

const channel =
supabaseClient.channel("quran-room-" + room);

const peers = {};
const names = {};

const videoGrid =
document.getElementById("videoGrid");

const emptyMessage =
document.getElementById("emptyMessage");


/* =========================================================
   ICONS
   ========================================================= */

function micIcon(muted){
  return muted ? "🔇" : "🎤";
}

function cameraIcon(off){
  return off ? "📷" : "🎥";
}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(text){

  const toast =
  document.getElementById("toast");

  toast.textContent = text;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },3000);
}


/* =========================================================
   CHAT
   ========================================================= */

function toggleChat(){

  document
  .getElementById("chatPanel")
  .classList.toggle("open");
}


function addMessage(name,text){

  const box =
  document.getElementById("messages");

  const div =
  document.createElement("div");

  div.className = "message";

  const strong =
  document.createElement("strong");

  strong.textContent = name;

  const span =
  document.createElement("span");

  span.textContent = text;

  div.appendChild(strong);
  div.appendChild(span);

  box.appendChild(div);

  box.scrollTop = box.scrollHeight;
}


async function sendChat(){

  const input =
  document.getElementById("chatInput");

  const text =
  input.value.trim();

  if(!text) return;

  addMessage(myName,text);

  await channel.send({
    type:"broadcast",
    event:"chat",
    payload:{
      senderId:myId,
      sender:myName,
      message:text
    }
  });

  input.value="";
}


document
.getElementById("chatInput")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") sendChat();
});


/* =========================================================
   JOIN
   ========================================================= */

async function joinClass(){

  const input =
  document.getElementById("nameInput");

  const name =
  input.value.trim();

  if(!name){
    alert("Please enter your name.");
    return;
  }

  myName = name;

  try{

    localStream =
    await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

  }catch(error){

    alert(
      "Camera/Microphone permission is required to join the class."
    );

    console.error(error);
    return;
  }

  createLocalTile();

  document
  .getElementById("joinScreen")
  .style.display="none";

  await channel.subscribe();

  setTimeout(()=>{
    sendHello();
  },1000);
}


/* =========================================================
   LOCAL VIDEO
   ========================================================= */

function createLocalTile(){

  const tile =
  document.createElement("div");

  tile.className="tile";
  tile.id="tile-"+myId;

  const video =
  document.createElement("video");

  video.autoplay=true;
  video.playsInline=true;
  video.muted=true;
  video.srcObject=localStream;

  const name =
  document.createElement("div");

  name.className="tile-name";
  name.textContent=myName+" (You)";

  const status =
  document.createElement("div");

  status.className="tile-status";
  status.id="status-"+myId;

  status.innerHTML =
    '<div class="status-icon">'+micIcon(false)+'</div>'+
    '<div class="status-icon">'+cameraIcon(false)+'</div>';

  tile.appendChild(video);
  tile.appendChild(name);
  tile.appendChild(status);

  videoGrid.appendChild(tile);

  emptyMessage.style.display="none";
}


/* =========================================================
   HELLO
   ========================================================= */

function sendHello(){

  channel.send({
    type:"broadcast",
    event:"hello",
    payload:{
      senderId:myId,
      sender:myName
    }
  });
}


/* =========================================================
   WEBRTC PEER
   ========================================================= */

function createPeer(peerId,peerName,initiator){

  if(peers[peerId]){
    return peers[peerId];
  }

  names[peerId]=peerName;

  const pc =
  new RTCPeerConnection({
    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]
  });

  peers[peerId]=pc;

  localStream
  .getTracks()
  .forEach(track=>{
    pc.addTrack(track,localStream);
  });

  pc.onicecandidate = event => {

    if(event.candidate){

      channel.send({
        type:"broadcast",
        event:"candidate",
        payload:{
          senderId:myId,
          targetId:peerId,
          candidate:event.candidate
        }
      });

    }
  };


  pc.ontrack = event => {

    createRemoteTile(
      peerId,
      peerName,
      event.streams[0]
    );

  };


  pc.onconnectionstatechange = ()=>{

    if(
      pc.connectionState==="failed" ||
      pc.connectionState==="disconnected" ||
      pc.connectionState==="closed"
    ){

      removePeer(peerId);

    }

  };


  if(initiator){

    makeOffer(peerId,pc);

  }

  return pc;
}


/* =========================================================
   OFFER
   ========================================================= */

async function makeOffer(peerId,pc){

  try{

    const offer =
    await pc.createOffer();

    await pc.setLocalDescription(offer);

    await channel.send({
      type:"broadcast",
      event:"offer",
      payload:{
        senderId:myId,
        targetId:peerId,
        offer:offer,
        sender:myName
      }
    });

  }catch(error){

    console.error("Offer error:",error);

  }
}


/* =========================================================
   REMOTE TILE
   ========================================================= */

function createRemoteTile(peerId,peerName,stream){

  let tile =
  document.getElementById("tile-"+peerId);

  if(!tile){

    tile =
    document.createElement("div");

    tile.className="tile";
    tile.id="tile-"+peerId;

    const video =
    document.createElement("video");

    video.autoplay=true;
    video.playsInline=true;
    video.srcObject=stream;

    const name =
    document.createElement("div");

    name.className="tile-name";
    name.textContent=peerName;

    const status =
    document.createElement("div");

    status.className="tile-status";
    status.id="status-"+peerId;

    status.innerHTML =
      '<div class="status-icon">🎤</div>'+
      '<div class="status-icon">🎥</div>';

    tile.appendChild(video);
    tile.appendChild(name);
    tile.appendChild(status);

    videoGrid.appendChild(tile);

    emptyMessage.style.display="none";

  }else{

    const video =
    tile.querySelector("video");

    video.srcObject=stream;

  }
}


/* =========================================================
   REMOVE PEER
   ========================================================= */

function removePeer(peerId){

  if(peers[peerId]){

    try{
      peers[peerId].close();
    }catch(e){}

    delete peers[peerId];

  }

  const tile =
  document.getElementById("tile-"+peerId);

  if(tile){
    tile.remove();
  }

  delete names[peerId];

}


/* =========================================================
   SUPABASE EVENTS
   ========================================================= */

channel.on(
  "broadcast",
  {event:"hello"},
  async ({payload})=>{

    if(!payload) return;

    const peerId =
    payload.senderId;

    if(peerId===myId) return;

    names[peerId]=payload.sender;

    showToast(
      payload.sender+" joined the class"
    );

    /*
      Only one side creates the offer.
      This prevents both sides from fighting.
    */

    const initiator =
    myId < peerId;

    createPeer(
      peerId,
      payload.sender,
      initiator
    );

  }
);


channel.on(
  "broadcast",
  {event:"offer"},
  async ({payload})=>{

    if(!payload) return;

    if(payload.targetId!==myId) return;

    const peerId =
    payload.senderId;

    const pc =
    createPeer(
      peerId,
      payload.sender,
      false
    );

    try{

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          payload.offer
        )
      );

      const answer =
      await pc.createAnswer();

      await pc.setLocalDescription(answer);

      await channel.send({
        type:"broadcast",
        event:"answer",
        payload:{
          senderId:myId,
          targetId:peerId,
          answer:answer,
          sender:myName
        }
      });

    }catch(error){

      console.error("Answer error:",error);

    }

  }
);


channel.on(
  "broadcast",
  {event:"answer"},
  async ({payload})=>{

    if(!payload) return;

    if(payload.targetId!==myId) return;

    const pc =
    peers[payload.senderId];

    if(!pc) return;

    try{

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          payload.answer
        )
      );

    }catch(error){

      console.error("Remote answer error:",error);

    }

  }
);


channel.on(
  "broadcast",
  {event:"candidate"},
  async ({payload})=>{

    if(!payload) return;

    if(payload.targetId!==myId) return;

    const pc =
    peers[payload.senderId];

    if(!pc) return;

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          payload.candidate
        )
      );

    }catch(error){

      console.error("ICE error:",error);

    }

  }
);


/* =========================================================
   CHAT EVENT
   ========================================================= */

channel.on(
  "broadcast",
  {event:"chat"},
  ({payload})=>{

    if(!payload) return;

    if(payload.senderId===myId) return;

    addMessage(
      payload.sender,
      payload.message
    );

  }
);


/* =========================================================
   CAMERA
   ========================================================= */

function toggleCamera(){

  if(!localStream) return;

  const track =
  localStream.getVideoTracks()[0];

  if(!track) return;

  cameraOn=!cameraOn;

  track.enabled=cameraOn;

  const btn =
  document.getElementById("cameraBtn");

  btn.classList.toggle("off",!cameraOn);

  btn.dataset.tip =
    cameraOn ? "Camera" : "Camera Off";

  updateLocalStatus();
}


/* =========================================================
   MICROPHONE
   ========================================================= */

function toggleMic(){

  if(!localStream) return;

  const track =
  localStream.getAudioTracks()[0];

  if(!track) return;

  micOn=!micOn;

  track.enabled=micOn;

  const btn =
  document.getElementById("micBtn");

  btn.classList.toggle("off",!micOn);

  btn.dataset.tip =
    micOn ? "Microphone" : "Microphone Muted";

  updateLocalStatus();
}


/* =========================================================
   LOCAL STATUS
   ========================================================= */

function updateLocalStatus(){

  const status =
  document.getElementById(
    "status-"+myId
  );

  if(!status) return;

  status.innerHTML =
    '<div class="status-icon">'+
    micIcon(!micOn)+
    '</div>'+
    '<div class="status-icon">'+
    cameraIcon(!cameraOn)+
    '</div>';
}


/* =========================================================
   SCREEN SHARE
   ========================================================= */

async function toggleScreen(){

  if(!localStream) return;

  if(!screenOn){

    try{

      screenStream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true
      });

      const screenTrack =
      screenStream.getVideoTracks()[0];

      for(const peerId in peers){

        const sender =
        peers[peerId]
        .getSenders()
        .find(
          s=>s.track &&
          s.track.kind==="video"
        );

        if(sender){

          await sender.replaceTrack(
            screenTrack
          );

        }

      }

      const localVideo =
      document.querySelector(
        "#tile-"+myId+" video"
      );

      if(localVideo){

        localVideo.srcObject =
        screenStream;

      }

      screenOn=true;

      document
      .getElementById("screenBtn")
      .classList.add("active");

      document
      .getElementById("screenBtn")
      .dataset.tip =
        "Stop Screen Share";


      screenTrack.onended = ()=>{
        stopScreen();
      };

    }catch(error){

      console.log(
        "Screen share cancelled"
      );

    }

  }else{

    stopScreen();

  }
}


/* =========================================================
   STOP SCREEN
   ========================================================= */

async function stopScreen(){

  if(!screenOn) return;

  const cameraTrack =
  localStream.getVideoTracks()[0];

  for(const peerId in peers){

    const sender =
    peers[peerId]
    .getSenders()
    .find(
      s=>s.track &&
      s.track.kind==="video"
    );

    if(sender){

      await sender.replaceTrack(
        cameraTrack
      );

    }

  }

  if(screenStream){

    screenStream
    .getTracks()
    .forEach(track=>{
      track.stop();
    });

  }

  const localVideo =
  document.querySelector(
    "#tile-"+myId+" video"
  );

  if(localVideo){

    localVideo.srcObject =
    localStream;

  }

  screenOn=false;

  document
  .getElementById("screenBtn")
  .classList.remove("active");

  document
  .getElementById("screenBtn")
  .dataset.tip =
    "Screen Share";
}


/* =========================================================
   ENTER KEY ON NAME
   ========================================================= */

document
.getElementById("nameInput")
.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    joinClass();
  }
});

</script></body>
