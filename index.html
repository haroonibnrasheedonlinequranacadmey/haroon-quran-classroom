<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#071b15;
  color:white;
}

body{
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:58px;
  background:#0b6b4f;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 12px;
  flex-shrink:0;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
  z-index:50;
}

header h1{
  margin:0;
  font-size:19px;
  font-weight:600;
  text-align:center;
}

header span{
  font-weight:400;
}

/* MAIN */

#app{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
}

#joinScreen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top,#124f3c,#06150f 65%);
  z-index:100;
}

.joinBox{
  width:min(420px,92%);
  background:rgba(10,35,27,.95);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.joinBox h2{
  margin:0 0 8px;
  font-size:25px;
}

.joinBox p{
  margin:0 0 20px;
  color:#b9d4ca;
}

#nameInput{
  width:100%;
  padding:14px;
  border:0;
  outline:none;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px;
}

#joinBtn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  background:#0b6b4f;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#joinBtn:hover{
  background:#0e805f;
}

/* VIDEO AREA */

#videoArea{
  flex:1;
  min-height:0;
  position:relative;
  background:#020807;
  overflow:hidden;
}

#videoGrid{
  width:100%;
  height:100%;
  padding:10px;
  display:grid;
  gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  grid-auto-rows:minmax(220px,1fr);
  position:relative;
}

/* NORMAL TILE */

.tile{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  border-radius:14px;
  background:#101815;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 5px 25px rgba(0,0,0,.30);
}

.cameraVideo,
.screenVideo{
  width:100%;
  height:100%;
  display:block;
  background:#020202;
}

.cameraVideo{
  object-fit:cover;
}

.screenVideo{
  display:none;
  object-fit:contain;
}

/* SCREEN SHARE MAIN */

.tile.screen-sharing{
  z-index:10;
}

.tile.screen-sharing .screenVideo{
  display:block;
  position:absolute;
  inset:0;
  z-index:1;
}

.tile.screen-sharing .cameraVideo{
  position:absolute;
  z-index:5;

  width:clamp(115px,22%,250px);
  height:auto;
  aspect-ratio:16/9;

  right:16px;
  bottom:16px;

  border-radius:12px;
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 5px 25px rgba(0,0,0,.55);

  object-fit:cover;
}

/* CAMERA OFF */

.tile.camera-off .cameraVideo{
  display:none;
}

/* BRAND BACKGROUND */

.brandBackground{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 30% 20%,rgba(25,125,91,.40),transparent 35%),
    radial-gradient(circle at 75% 80%,rgba(15,86,65,.35),transparent 40%),
    linear-gradient(135deg,#061b14,#0b392b 55%,#04110d);
  z-index:2;
}

.brandInner{
  padding:20px;
}

.brandInner .quran{
  font-size:36px;
  margin-bottom:8px;
}

.brandInner h3{
  margin:0;
  font-size:20px;
}

.brandInner p{
  margin:7px 0 0;
  color:#b7d7cb;
  font-size:13px;
}

.tile.camera-off:not(.screen-sharing) .brandBackground{
  display:flex;
}

/* NAME LABEL */

.nameLabel{
  position:absolute;
  left:10px;
  bottom:10px;
  z-index:20;

  background:rgba(0,0,0,.62);
  color:white;

  padding:6px 10px;
  border-radius:8px;

  font-size:13px;
  max-width:75%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  backdrop-filter:blur(5px);
}

/* SCREEN SHARE LAYOUT */

#videoGrid.has-screen-share{
  display:block;
  padding:0;
}

#videoGrid.has-screen-share .tile.screen-sharing{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:0;
  border:0;
}

#videoGrid.has-screen-share .tile:not(.screen-sharing){
  position:absolute;
  width:170px;
  height:105px;
  right:16px;
  top:16px;
  z-index:30;
  border-radius:11px;
}

#videoGrid.has-screen-share .tile:not(.screen-sharing) .nameLabel{
  font-size:11px;
  padding:4px 7px;
  bottom:5px;
  left:5px;
}

#videoGrid.has-screen-share .tile:nth-child(3):not(.screen-sharing){
  top:130px;
}

/* CONTROLS */

#controls{
  height:70px;
  flex-shrink:0;
  background:#071510;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:8px;
  border-top:1px solid rgba(255,255,255,.08);
  z-index:50;
}

.controlBtn{
  min-width:52px;
  height:48px;
  padding:0 13px;
  border:0;
  border-radius:12px;
  background:#17342a;
  color:white;
  cursor:pointer;
  font-size:13px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  transition:
    background .18s ease,
    color .18s ease,
    transform .12s ease;
}

.controlBtn:hover{
  background:#205040;
}

.controlBtn:active{
  transform:scale(.96);
}

.controlBtn svg{
  width:20px;
  height:20px;
  flex-shrink:0;
}

.controlBtn.active{
  background:#0b6b4f;
}

.controlBtn.screen-active{
  background:#1976d2;
}

.controlBtn.off{
  background:#a72c2c;
  color:white;
}

.controlBtn.off:hover{
  background:#c43737;
}

.controlBtn.leave{
  background:#a72c2c;
}

.controlBtn.leave:hover{
  background:#c43737;
}

/* CHAT */

#chatPanel{
  position:absolute;
  right:12px;
  bottom:82px;

  width:min(340px,calc(100% - 24px));
  height:430px;

  background:#0b1914;
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;

  display:none;
  flex-direction:column;

  z-index:100;
  box-shadow:0 15px 50px rgba(0,0,0,.5);

.chatHeader{

  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,.08);
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.message{
  margin-bottom:8px;
  padding:8px 10px;
  border-radius:9px;
  background:#17342a;
  text-align:left;
  font-size:13px;
}

.message b{
  display:block;
  margin-bottom:3px;
  color:#7ee1bd;
}

.chatInputRow{
  display:flex;
  gap:7px;
  padding:9px;
  border-top:1px solid rgba(255,255,255,.08);

#chatInput{
  flex:1;

  padding:10px;

#sendChat{
  border:0;
  border-radius:8px;
  background:#0b6b4f;
  color:white;
  padding:0 13px;

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);

  background:rgba(0,0,0,.78);
  color:white;

  padding:10px 16px;
  border-radius:9px;

  transition:.25s;

  z-index:300;
  font-size:13px;

#toast.show{

/* MOBILE */

@media(max-width:360px){

/* =========================================================
   JOIN SOUND
========================================================= */

function playJoinSound(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;

    const ctx =
      new AudioContext();

    const now =
      ctx.currentTime;

    const gain =
      ctx.createGain();

    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(
      0,
      now
    );

    gain.gain.linearRampToValueAtTime(
      0.16,
      now + 0.03
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + 1.25
    );

    const osc1 =
      ctx.createOscillator();

    osc1.type = "sine";

    osc1.frequency.setValueAtTime(
      880,
      now
    );

    osc1.connect(gain);

    osc1.start(now);
    osc1.stop(now + 0.45);


    const osc2 =
      ctx.createOscillator();

    osc2.type = "sine";

    osc2.frequency.setValueAtTime(
      1175,
      now + 0.42
    );

    osc2.connect(gain);

    osc2.start(now + 0.42);
    osc2.stop(now + 1.2);

    setTimeout(()=>{
      ctx.close().catch(()=>{});
    },1600);

  }catch(e){

    console.log(
      "Join sound unavailable:",
      e
    );

  }

}

/* =========================================================
   BROADCAST HELPER
========================================================= */

async function sendEvent(
  event,
  payload
){

  if(!channel) return;

  try{

    await channel.send({
      type:"broadcast",
      event:event,
      payload:payload
    });

  }catch(e){

    console.log(
      "Broadcast error:",
      e
    );

  }

}

/* =========================================================
   LOCAL TILE
========================================================= */

function createLocalTile(){

  let tile =
    document.getElementById(
      "tile-" + myId
    );

  if(tile) return tile;

  tile =
    document.createElement("div");

  tile.className =
    "tile local-tile";

  tile.id =

  tile.innerHTML = `

    <video
      class="cameraVideo"
      autoplay
      muted
      playsinline

    <video
      class="screenVideo"

  tile.appendChild(
    createBrandBackground()
  );

  nameLabel.className =

  tile.appendChild(

  const cameraVideo =
    tile.querySelector(

    );

  cameraVideo.srcObject =
    localStream;

  cameraVideo.play()

/* =========================================================
   CREATE CAMERA + AUDIO PEER
   CAMERA FIXED VERSION
========================================================= */

async function createPeer(
  peerId,
  peerName,
  initiator
){

  /*
    Already created.
  */
  if(peers[peerId]){

    return peers[peerId];

  }


  /*
    Prevent simultaneous creation of
    two PeerConnections for the same user.
  */
  if(creatingPeers[peerId]){

    return creatingPeers[peerId];

  }


  creatingPeers[peerId] =
    (async()=>{

      /*
        Double-check after waiting.
      */
      if(peers[peerId]){

        return peers[peerId];

      }


      const pc =
        new RTCPeerConnection(
          {
            iceServers:ICE_SERVERS
          }
        );


      const peerData = {

        pc:pc,

        name:safeName(peerName),

        /*
          Keep one MediaStream for all
          incoming camera/audio tracks.
        */
        remoteStream:
          new MediaStream()

      };


      peers[peerId] =
        peerData;


      createRemoteTile(
        peerId,
        peerName
      );


      /*
        Add local camera + microphone.
      */
      if(localStream){

        localStream
          .getTracks()
          .forEach(track=>{

            try{

              pc.addTrack(
                track,
                localStream
              );

            }catch(error){

              console.error(
                "Add local track error:",
                error
              );

            }

          });

      }


      pc.onicecandidate =
        event=>{

          if(
            event.candidate
          ){

            sendEvent(
              "candidate",
              {
                from:myId,
                to:peerId,
                candidate:event.candidate
              }
            );

          }

        };


      /*
        CAMERA FIX:
        Build a stable MediaStream from
        every remote track instead of relying
        only on event.streams[0].
      */
      pc.ontrack =
        event=>{

          try{

            const tile =
              createRemoteTile(
                peerId,
                peerData.name
              );


            const video =
              tile.querySelector(
                ".cameraVideo"
              );


            /*
              Add each incoming track only once.
            */
            if(
              event.track &&
              !peerData.remoteStream
                .getTracks()
                .some(
                  track=>
                    track.id ===
                    event.track.id
                )
            ){

              peerData.remoteStream.addTrack(
                event.track
              );

            }


            /*
              Always attach our stable
              MediaStream to the video.
            */
            if(
              video.srcObject !==
              peerData.remoteStream
            ){

              video.srcObject =
                peerData.remoteStream;

            }


            /*
              Make sure remote camera
              is actually allowed to play.
            */
            video.muted = true;

            const playPromise =
              video.play();

            if(playPromise){

              playPromise.catch(
                error=>{
                  console.log(
                    "Remote camera play waiting:",
                    error
                  );
                }
              );

            }


            /*
              If track is later enabled/disabled,
              keep the video element alive.
            */
            event.track.onended =
              ()=>{

                console.log(
                  "Remote camera track ended:",
                  peerId,
                  event.track.kind
                );

              };


          }catch(error){

            console.error(
              "Remote camera track error:",
              error
            );

          }

        };


      pc.onconnectionstatechange =
        ()=>{

          console.log(
            "Camera connection:",
            peerId,
            pc.connectionState
          );


          if(
            pc.connectionState ===
            "failed"
          ){

            console.log(
              "Camera connection failed:",
              peerId
            );

          }

        };


      pc.oniceconnectionstatechange =
        ()=>{

          console.log(
            "Camera ICE:",
            peerId,
            pc.iceConnectionState
          );

        };


      if(initiator){

        const offer =
          await pc.createOffer();


        await pc.setLocalDescription(
          offer
        );


        await sendEvent(
          "offer",
          {
            from:myId,
            to:peerId,
            offer:offer,
            name:myName,
            cameraOn:cameraOn,
            micOn:micOn
          }
        );

      }


      return peerData;

    })();


  try{

    return await creatingPeers[peerId];

  }finally{

    delete creatingPeers[peerId];

  }

}


/* =========================================================
   CAMERA OFFER
========================================================= */

channel.on(
  "broadcast",
  {
    event:"offer"
  },
  async ({payload})=>{

    if(
      !payload ||
      payload.to !== myId
    ) return;


    const peerId =
      payload.from;


    const peerData =
      await createPeer(
        peerId,
        payload.name,
        false
      );


    const pc =
      peerData.pc;


    try{

      /*
        Ignore duplicate offer if already
        connected/negotiating.
      */
      if(
        pc.signalingState !==
        "stable"
      ){

        console.log(
          "Ignoring duplicate camera offer:",
          peerId
        );

        return;

      }


      await pc.setRemoteDescription(
        payload.offer
      );


      if(
        pendingCandidates[peerId]
      ){

        for(
          const candidate
          of pendingCandidates[peerId]
        ){

          await pc
            .addIceCandidate(
              candidate
            )
            .catch(()=>{});

        }

        delete pendingCandidates[
          peerId
        ];

      }


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      await sendEvent(
        "answer",
        {
          from:myId,
          to:peerId,
          answer:answer
        }
      );


    }catch(error){

      console.error(
        "Offer error:",
        error
      );

    }

  }
);


/* =========================================================
   CAMERA ANSWER
========================================================= */

channel.on(
  "broadcast",
  {
    event:"answer"
  },
  async ({payload})=>{

    if(
      !payload ||
      payload.to !== myId
    ) return;


    const peer =
      peers[payload.from];

    if(!peer) return;


    try{

      if(
        peer.pc.signalingState ===
        "have-local-offer"
      ){

        await peer.pc.setRemoteDescription(
          payload.answer
        );

      }


      if(
        pendingCandidates[
          payload.from
        ]
      ){

        for(
          const candidate
          of pendingCandidates[
            payload.from
          ]
        ){

          await peer.pc
            .addIceCandidate(
              candidate
            )
            .catch(()=>{});

        }

        delete pendingCandidates[
          payload.from
        ];

      }

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


/* =========================================================
   CAMERA ICE
========================================================= */

channel.on(
  "broadcast",
  {
    event:"candidate"
  },
  async ({payload})=>{

    if(
      !payload ||
      payload.to !== myId
    ) return;


    const peerId =
      payload.from;


    const peer =
      peers[peerId];


    if(
      !peer ||
      !peer.pc.remoteDescription
    ){

      if(
        !pendingCandidates[peerId]
      ){

        pendingCandidates[
          peerId
        ] = [];

      }

      pendingCandidates[
        peerId
      ].push(
        payload.candidate
      );

      return;
    }


    await peer.pc
      .addIceCandidate(
        payload.candidate
      )
      .catch(()=>{});

  }
);

/* =========================================================
   PRESENCE
========================================================= */

channel.on(
  "presence",
  {
    event:"sync"
  },
  async ()=>{

    const state =
      channel.presenceState();


    for(
      const key in state
    ){

      if(key === myId)
        continue;


      const item =
        state[key] &&
        state[key][0];


      if(!item)
        continue;


      createRemoteTile(
        key,
        item.name || "Participant"
      );


      const tile =
        document.getElementById(
          "tile-" + key
        );


      if(item.cameraOn === false){

        tile.classList.add(
          "camera-off"
        );

      }else{

        tile.classList.remove(
          "camera-off"
        );

      }


      const initiator =
        myId < key;


      await createPeer(
        key,
        item.name || "Participant",
        initiator
      );


      if(
        screenOn &&
        screenStream
      ){

        await startScreenPeerFor(
          key
        );

      }

    }

  }
);

/* =========================================================
   START SCREEN SHARE
========================================================= */

async function startScreenShare(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getDisplayMedia
  ){

    showToast(
      "Screen sharing is not supported on this browser"
    );

    return;

  }


  try{

    screenStream =
      await navigator.mediaDevices.getDisplayMedia({

        video:{
          frameRate:{
            ideal:30,
            max:30
          }
        },

        audio:false

      });


    const screenTrack =
      screenStream.getVideoTracks()[0];


    if(
      screenTrack &&
      "contentHint" in screenTrack
    ){

      screenTrack.contentHint =
        "detail";

    }


    screenOn = true;


    const localTile =
      createLocalTile();


    const screenVideo =
      localTile.querySelector(
        ".screenVideo"
      );


    screenVideo.srcObject =
      screenStream;


    localTile.classList.add(
      "screen-sharing"
    );


    screenVideo.play()
      .catch(()=>{});


    updateControlButtons();


    updateScreenLayout();


    for(
      const peerId in peers
    ){

      await startScreenPeerFor(
        peerId
      );

    }


    screenTrack.onended =
      async ()=>{

        if(screenOn){

          await stopScreenShare();

        }

      };


    showToast(
      "Screen sharing started"
    );


  }catch(error){

    console.error(
      "Screen share error:",
      error
    );

    screenStream = null;
    screenOn = false;

    updateControlButtons();

    showToast(
      "Screen sharing cancelled"
    );

  }

}


/* =========================================================
   CREATE SCREEN PEER
========================================================= */

async function startScreenPeerFor(
  peerId
){

  if(
    !screenOn ||
    !screenStream
  ){

    return;

  }


  if(screenPeers[peerId]){

    return;

  }


  const pc =
    new RTCPeerConnection(
      {
        iceServers:ICE_SERVERS
      }
    );


  screenPeers[peerId] =
    pc;


  const screenTrack =
    screenStream.getVideoTracks()[0];


  if(screenTrack){

    const sender =
      pc.addTrack(
        screenTrack,
        screenStream
      );


    try{

      const params =
        sender.getParameters();


      if(
        !params.encodings ||
        !params.encodings.length
      ){

        params.encodings = [{}];

      }


      params.encodings[0].maxFramerate =
        30;

      params.encodings[0].maxBitrate =
        3000000;


      await sender.setParameters(
        params
      );

    }catch(e){

      console.log(
        "Screen sender parameters:",
        e
      );

    }

  }


  pc.onicecandidate =
    event=>{

      if(
        event.candidate
      ){

        sendEvent(
          "screen-candidate",
          {
            from:myId,
            to:peerId,
            candidate:event.candidate
          }
        );

      }

    };


  pc.ontrack =
    event=>{

      const peer =
        peers[peerId];


      const peerName =
        peer ?
        peer.name :
        "Participant";


      const tile =
        createRemoteTile(
          peerId,
          peerName
        );


      const video =
        tile.querySelector(
          ".screenVideo"
        );


      if(
        event.streams &&
        event.streams[0]
      ){

        video.srcObject =
          event.streams[0];

      }


      tile.classList.add(
        "screen-sharing"
      );


      video.play()
        .catch(()=>{});


      updateScreenLayout();

    };


  pc.onconnectionstatechange =
    ()=>{

      if(
        pc.connectionState ===
        "failed"
      ){

        console.log(
          "Screen connection failed:",
          peerId
        );

      }

    };


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  await sendEvent(
    "screen-offer",
    {
      from:myId,
      to:peerId,
      offer:offer,
      name:myName
    }
  );

}

    const screenVideo =
      localTile.querySelector(
        ".screenVideo"
      );


    if(screenVideo){

      screenVideo.srcObject =
        null;

    }

  }


  document
    .querySelectorAll(
      ".tile.screen-sharing"
    )
    .forEach(tile=>{

      if(
        tile.id !==
        "tile-" + myId
      ){

        tile.classList.remove(
          "screen-sharing"
        );


        const video =
          tile.querySelector(
            ".screenVideo"
          );


        if(video){

          video.srcObject =
            null;

        }

      }

    });


  updateControlButtons();

  updateScreenLayout();


  showToast(
    "Screen sharing stopped"
  );

}


/* =========================================================
   REMOTE SCREEN STOP
========================================================= */

channel.on(
  "broadcast",
  {
    event:"screen-stop"
  },
  ({payload})=>{

    if(
      !payload ||
      payload.from === myId
    ) return;


    const peerId =
      payload.from;


    if(
      screenPeers[peerId]
    ){

      try{

        screenPeers[
          peerId
        ].close();

      }catch(e){}


      delete screenPeers[
        peerId
      ];

    }


    const tile =
      document.getElementById(
        "tile-" + peerId
      );


    if(tile){

      tile.classList.remove(
        "screen-sharing"
      );


      const video =
        tile.querySelector(
          ".screenVideo"
        );


      if(video){

        video.srcObject =
          null;

      }

    }


    updateScreenLayout();

  }
);


/* =========================================================
   CHAT BUTTON
========================================================= */

chatBtn.onclick =
function(){

  if(
    chatPanel.style.display ===
    "flex"
  ){

    chatPanel.style.display =
      "none";

  }else{

    chatPanel.style.display =
      "flex";

    chatInput.focus();

  }

};


/* =========================================================
   SEND CHAT
========================================================= */

async function sendChatMessage(){

  const text =
    chatInput.value.trim();


  if(!text) return;


  await sendEvent(
    "chat-message",
    {
      from:myId,
      name:myName,
      message:text
    }
  );


  addMessage(
    myName,
    text
  );


  chatInput.value =
    "";

}


sendChat.onclick =
sendChatMessage;


chatInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      sendChatMessage();

    }

  }
);


/* =========================================================
   RECEIVE CHAT
========================================================= */

channel.on(
  "broadcast",
  {
    event:"chat-message"
  },
  ({payload})=>{

    if(
      !payload ||
      payload.from === myId
    ) return;


    addMessage(
      payload.name ||
      "Participant",

      payload.message ||
      ""
    );

  }
);


function addMessage(
  name,
  text
){

  const item =
    document.createElement("div");

  item.className =
    "message";


  const sender =
    document.createElement("b");

  sender.textContent =
    safeName(name);


  const message =
    document.createElement("div");

  message.textContent =
    text;


  item.appendChild(
    sender
  );

  item.appendChild(
    message
  );


  messages.appendChild(
    item
  );


  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================================================
   LEAVE
========================================================= */

leaveBtn.onclick =
async function(){

  if(
    screenOn
  ){

    await stopScreenShare();

  }


  for(
    const peerId in peers
  ){

    try{

      peers[
        peerId
      ].pc.close();

    }catch(e){}

  }


  for(
    const peerId in screenPeers
  ){

    try{

      screenPeers[
        peerId
      ].close();

    }catch(e){}

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    localStream =
      null;

  }


  try{

    await channel.untrack();

  }catch(e){}


  try{

    await channel.unsubscribe();

  }catch(e){}


  joined =
    false;


  location.reload();

};


/* =========================================================
   PAGE START
========================================================= */

updateControlButtons();

</script>
