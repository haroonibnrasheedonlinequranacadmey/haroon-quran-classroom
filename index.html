<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haroon Ibn Rasheed | Online Quran Academy</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#151b1f;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
  height:68px;
  background:linear-gradient(135deg,#ffffff,#f4f7f5);
  color:#146b52;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:20px;
  font-weight:700;
  letter-spacing:.2px;
  box-shadow:0 2px 10px rgba(0,0,0,.28);
  position:relative;
  z-index:20;
}

.topbar small{
  display:block;
  font-size:11px;
  color:#777;
  margin-top:3px;
  font-weight:500;
}

/* =========================================================
   VIDEO AREA
   ========================================================= */

.video-area{
  height:calc(100vh - 68px);
  padding:18px 18px 100px;
  overflow:auto;
  background:
    radial-gradient(circle at top right,#263a35 0,#151b1f 38%),
    #151b1f;
}

.video-grid{
  width:100%;
  min-height:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  grid-auto-rows:minmax(190px,1fr);
  gap:12px;
  align-content:center;
}

.empty-message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#aeb7b4;
  text-align:center;
  font-size:15px;
}

/* =========================================================
   VIDEO TILE
   ========================================================= */

.tile{
  background:#252b2e;
  border-radius:13px;
  overflow:hidden;
  position:relative;
  min-height:190px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.06);
}

.tile video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#0b0d0e;
}

.tile-name{
  position:absolute;
  left:10px;
  bottom:10px;
  background:rgba(0,0,0,.70);
  padding:7px 10px;
  border-radius:8px;
  font-size:14px;
  z-index:2;
  max-width:75%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.tile-status{
  position:absolute;
  right:10px;
  bottom:10px;
  display:flex;
  gap:5px;
  z-index:2;
}

.status-icon{
  background:rgba(0,0,0,.70);
  border-radius:50%;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

/* =========================================================
   JOIN SCREEN
   ========================================================= */

.join-screen{
  position:fixed;
  inset:0;
  background:rgba(8,15,13,.97);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.join-box{
  width:min(430px,100%);
  background:white;
  color:#222;
  border-radius:20px;
  padding:32px;
  box-shadow:0 18px 60px rgba(0,0,0,.55);
  text-align:center;
}

.join-logo{
  width:64px;
  height:64px;
  border-radius:50%;
  margin:0 auto 15px;
  background:#146b52;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
}

.join-box h2{
  color:#146b52;
  margin-bottom:6px;
  font-size:22px;
}

.join-box .academy-sub{
  color:#777;
  font-size:13px;
  margin-bottom:22px;
}

.join-box input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:15px;
  margin-bottom:12px;
  outline:none;
}

.join-box input:focus{
  border-color:#146b52;
  box-shadow:0 0 0 3px rgba(20,107,82,.10);
}

.join-btn{
  width:100%;
  border:0;
  background:#146b52;
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.join-btn:hover{
  background:#0e5943;
}

/* =========================================================
   BOTTOM CONTROLS
   ========================================================= */

.controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:rgba(29,34,36,.97);
  padding:9px 14px;
  border-radius:45px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:50;
  box-shadow:0 6px 28px rgba(0,0,0,.5);
}

.control{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#3b4245;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:.15s;
}

.control:hover{
  background:#555d60;
  transform:scale(1.05);
}

.control svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.control.off{
  background:#d93025;
}

.control.active{
  background:#146b52;
}

.control.leave{
  background:#d93025;
}

/* TOOLTIP */

.control::after{
  content:attr(data-tip);
  position:absolute;
  bottom:59px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:6px 9px;
  border-radius:6px;
  font-size:12px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

.control:hover::after{
  opacity:1;
}

/* =========================================================
   CHAT
   ========================================================= */

.chat-panel{
  position:fixed;
  left:14px;
  top:82px;
  bottom:90px;
  width:320px;
  background:white;
  color:#222;
  border-radius:14px;
  box-shadow:0 5px 25px rgba(0,0,0,.45);
  z-index:40;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transform:translateX(-350px);
  transition:.25s ease;
}

.chat-panel.open{
  transform:translateX(0);
}

.chat-head{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #ddd;
  font-weight:bold;
  color:#146b52;
}

.close-chat{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
  color:#555;
}

.messages{
  flex:1;
  overflow:auto;
  padding:12px;
}

.message{
  background:#f1f3f4;
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:8px;
  font-size:14px;
  word-break:break-word;
}

.message strong{
  display:block;
  margin-bottom:3px;
  color:#146b52;
}

.chat-input{
  display:flex;
  padding:10px;
  border-top:1px solid #ddd;
  gap:7px;
}

.chat-input input{
  flex:1;
  border:1px solid #ccc;
  border-radius:20px;
  padding:10px 13px;
  outline:none;
}

.chat-input button{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#146b52;
  color:white;
  cursor:pointer;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  top:82px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:white;
  color:#222;
  padding:10px 18px;
  border-radius:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:80;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:650px){

  .topbar{
    height:58px;
    font-size:16px;
    padding:0 10px;
  }

  .video-area{
    height:calc(100vh - 58px);
    padding:10px 10px 90px;
  }

  .video-grid{
    grid-template-columns:1fr;
    grid-auto-rows:220px;
  }

  .controls{
    bottom:10px;
    padding:7px 9px;
    gap:6px;
  }

  .control{
    width:43px;
    height:43px;
  }

  .control svg{
    width:20px;
    height:20px;
  }

  .chat-panel{
    width:calc(100% - 28px);
    top:70px;
    bottom:78px;
  }

  .empty-message{
    width:90%;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     TOP
     ======================================================= -->

<div class="topbar">
  <div>
    Haroon Ibn Rasheed | Online Quran Academy
  </div>
</div>

<!-- =======================================================
     VIDEOS
     ======================================================= -->

<div class="video-area">

  <div id="videoGrid" class="video-grid"></div>

  <div id="emptyMessage" class="empty-message">
    Waiting for students to join...
  </div>

</div>

<!-- =======================================================
     CHAT PANEL
     ======================================================= -->

<div id="chatPanel" class="chat-panel">

  <div class="chat-head">
    <span>Classroom Chat</span>

    <button
      class="close-chat"
      onclick="toggleChat()">
      ×
    </button>
  </div>

  <div
    id="messages"
    class="messages">
  </div>

  <div class="chat-input">

    <input
      id="chatInput"
      type="text"
      placeholder="Type a message...">

    <button onclick="sendChat()">
      ➤
    </button>

  </div>

</div>

<!-- =======================================================
     CONTROLS
     ======================================================= -->

<div class="controls">

  <!-- CAMERA -->

  <button
    id="cameraBtn"
    class="control"
    data-tip="Camera"
    onclick="toggleCamera()">

    <svg viewBox="0 0 24 24">
      <path d="M15 10l4.5-3v10L15 14z"></path>
      <rect x="3" y="6" width="12" height="12" rx="2"></rect>
    </svg>

  </button>


  <!-- MICROPHONE -->

  <button
    id="micBtn"
    class="control"
    data-tip="Microphone"
    onclick="toggleMic()">

    <svg viewBox="0 0 24 24">
      <rect x="8" y="3" width="8" height="12" rx="4"></rect>
      <path d="M5 11a7 7 0 0 0 14 0"></path>
      <path d="M12 18v3"></path>
      <path d="M9 21h6"></path>
    </svg>

  </button>


  <!-- SCREEN SHARE -->

  <button
    id="screenBtn"
    class="control"
    data-tip="Screen Share"
    onclick="toggleScreen()">

    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="14" rx="2"></rect>
      <path d="M8 21h8"></path>
      <path d="M12 18v3"></path>
    </svg>

  </button>


  <!-- CHAT -->

  <button
    id="chatBtn"
    class="control"
    data-tip="Chat"
    onclick="toggleChat()">

    <svg viewBox="0 0 24 24">
      <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-10.5A7.5 7.5 0 0 1 10.5 4H12.5A7.5 7.5 0 0 1 20 11.5z"></path>
    </svg>

  </button>


  <!-- LEAVE -->

  <button
    id="leaveBtn"
    class="control leave"
    data-tip="Leave Class"
    onclick="leaveClass()">

    <svg viewBox="0 0 24 24">
      <path d="M10 17l5-5-5-5"></path>
      <path d="M15 12H3"></path>
      <path d="M21 4v16"></path>
    </svg>

  </button>

</div>

<!-- =======================================================
     JOIN SCREEN
     ======================================================= -->

<div
  id="joinScreen"
  class="join-screen">

  <div class="join-box">

    <div class="join-logo">
      H
    </div>

    <h2>
      Online Quran Classroom
    </h2>

    <div class="academy-sub">
      Haroon Ibn Rasheed Online Quran Academy
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="Your Name"
      maxlength="40">

    <button
      class="join-btn"
      onclick="joinClass()">

      Join Class

    </button>

  </div>

</div>

<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>


<script>

/* =========================================================
   SUPABASE SETTINGS
   ========================================================= */

const SUPABASE_URL =
"https://haetymgmvotqfyvqwogq.supabase.co";

/*
===========================================================
sb_publishable_RdrOGrd2Ov8vxFJPGCvzFA_m7a_4Wo8
===========================================================
*/

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   VARIABLES
   ========================================================= */

let localStream = null;
let screenStream = null;

let cameraOn = true;
let micOn = true;
let screenOn = false;

let myName = "";

const myId =
crypto.randomUUID();

const room =
new URLSearchParams(
  location.search
).get("room") || "quran-class";

const channel =
supabaseClient.channel(
  "quran-room-" + room,
  {
    config:{
      broadcast:{
        self:false
      },
      presence:{
        key:myId
      }
    }
  }
);

const peers = {};
const names = {};
const pendingCandidates = {};

let joined = false;

const videoGrid =
document.getElementById("videoGrid");

const emptyMessage =
document.getElementById("emptyMessage");


/* =========================================================
   TOAST
   ========================================================= */

function showToast(text){

  const toast =
  document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },3000);
}


/* =========================================================
   CHAT
   ========================================================= */

function toggleChat(){

  document
  .getElementById("chatPanel")
  .classList.toggle("open");
}


function addMessage(name,text){

  const box =
  document.getElementById("messages");

  const div =
  document.createElement("div");

  div.className="message";

  const strong =
  document.createElement("strong");

  strong.textContent=name;

  const span =
  document.createElement("span");

  span.textContent=text;

  div.appendChild(strong);
  div.appendChild(span);

  box.appendChild(div);

  box.scrollTop =
  box.scrollHeight;
}


async function sendChat(){

  const input =
  document.getElementById("chatInput");

  const text =
  input.value.trim();

  if(!text || !joined)
    return;

  addMessage(
    myName + " (You)",
    text
  );

  try{

    await channel.send({
      type:"broadcast",
      event:"chat",
      payload:{
        senderId:myId,
        sender:myName,
        message:text
      }
    });

  }catch(error){

    console.error(
      "Chat error:",
      error
    );

  }

  input.value="";
}


document
.getElementById("chatInput")
.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      sendChat();
    }
  }
);


/* =========================================================
   JOIN
   ========================================================= */

async function joinClass(){

  const input =
  document.getElementById("nameInput");

  const name =
  input.value.trim();

  if(!name){

    alert(
      "Please enter your name."
    );

    return;
  }

  myName=name;

  try{

    localStream =
    await navigator.mediaDevices
    .getUserMedia({
      video:true,
      audio:true
    });

  }catch(error){

    console.error(
      "Camera/Microphone error:",
      error
    );

    alert(
      "Please allow Camera and Microphone permission."
    );

    return;
  }

  createLocalTile();

  document
  .getElementById("joinScreen")
  .style.display="none";

  try{

    await channel.subscribe(
      async status=>{

        console.log(
          "Supabase:",
          status
        );

        if(status==="SUBSCRIBED"){

          joined=true;

          await channel.track({
            userId:myId,
            name:myName
          });

          sendHello();

          showToast(
            "You joined the class"
          );
        }

      }
    );

  }catch(error){

    console.error(
      "Subscribe error:",
      error
    );

  }
}


/* =========================================================
   LOCAL TILE
   ========================================================= */

function createLocalTile(){

  const old =
  document.getElementById(
    "tile-"+myId
  );

  if(old) old.remove();

  const tile =
  document.createElement("div");

  tile.className="tile";

  tile.id=
  "tile-"+myId;

  const video =
  document.createElement("video");

  video.autoplay=true;
  video.playsInline=true;
  video.muted=true;
  video.srcObject=
  localStream;

  const name =
  document.createElement("div");

  name.className=
  "tile-name";

  name.textContent=
  myName+" (You)";

  const status =
  document.createElement("div");

  status.className=
  "tile-status";

  status.id=
  "status-"+myId;

  status.innerHTML=
    '<div class="status-icon">🎤</div>'+
    '<div class="status-icon">🎥</div>';

  tile.appendChild(video);
  tile.appendChild(name);
  tile.appendChild(status);

  videoGrid.appendChild(tile);

  emptyMessage.style.display=
  "none";
}


/* =========================================================
   HELLO
   ========================================================= */

async function sendHello(){

  try{

    await channel.send({
      type:"broadcast",
      event:"hello",
      payload:{
        senderId:myId,
        sender:myName
      }
    });

  }catch(error){

    console.error(
      "Hello error:",
      error
    );

  }
}


/* =========================================================
   WEBRTC PEER
   ========================================================= */

function createPeer(
  peerId,
  peerName,
  initiator
){

  if(peers[peerId]){
    return peers[peerId];
  }

  names[peerId]=
  peerName;

  pendingCandidates[peerId]=
  pendingCandidates[peerId] || [];

  const pc =
  new RTCPeerConnection({

    iceServers:[
      {
        urls:
        "stun:stun.l.google.com:19302"
      },
      {
        urls:
        "stun:stun1.l.google.com:19302"
      }
    ]

  });

  peers[peerId]=pc;


  /* ADD LOCAL TRACKS */

  if(localStream){

    localStream
    .getTracks()
    .forEach(track=>{

      pc.addTrack(
        track,
        localStream
      );

    });

  }


  /* ICE */

  pc.onicecandidate =
  event=>{

    if(!event.candidate)
      return;

    channel.send({

      type:"broadcast",

      event:"candidate",

      payload:{
        senderId:myId,
        targetId:peerId,
        candidate:
        event.candidate
      }

    });

  };


  /* REMOTE TRACK */

  pc.ontrack =
  event=>{

    if(!event.streams ||
       !event.streams[0])
      return;

    createRemoteTile(
      peerId,
      peerName,
      event.streams[0]
    );

  };


  /* CONNECTION STATE */

  pc.onconnectionstatechange =
  ()=>{

    console.log(
      peerName,
      pc.connectionState
    );

    if(
      pc.connectionState===
      "connected"
    ){

      showToast(
        peerName+
        " connected"
      );

    }

    if(
      pc.connectionState===
      "failed"
    ){

      removePeer(peerId);

    }

    if(
      pc.connectionState===
      "closed"
    ){

      removePeer(peerId);

    }

  };


  /* OFFER */

  if(initiator){

    makeOffer(
      peerId,
      pc
    );

  }

  return pc;
}


/* =========================================================
   OFFER
   ========================================================= */

async function makeOffer(
  peerId,
  pc
){

  try{

    const offer =
    await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    await channel.send({

      type:"broadcast",

      event:"offer",

      payload:{
        senderId:myId,
        targetId:peerId,
        offer:offer,
        sender:myName
      }

    });

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }
}


/* =========================================================
   REMOTE TILE
   ========================================================= */

function createRemoteTile(
  peerId,
  peerName,
  stream
){

  let tile =
  document.getElementById(
    "tile-"+peerId
  );

  if(!tile){

    tile =
    document.createElement("div");

    tile.className="tile";

    tile.id=
    "tile-"+peerId;

    const video =
    document.createElement("video");

    video.autoplay=true;
    video.playsInline=true;
    video.srcObject=
    stream;

    video.onloadedmetadata =
    ()=>{
      video.play().catch(
        ()=>{}
      );
    };

    const name =
    document.createElement("div");

    name.className=
    "tile-name";

    name.textContent=
    peerName;

    const status =
    document.createElement("div");

    status.className=
    "tile-status";

    status.id=
    "status-"+peerId;

    status.innerHTML=
      '<div class="status-icon">🎤</div>'+
      '<div class="status-icon">🎥</div>';

    tile.appendChild(video);
    tile.appendChild(name);
    tile.appendChild(status);

    videoGrid.appendChild(tile);

  }else{

    const video =
    tile.querySelector("video");

    if(video){

      video.srcObject=
      stream;

      video.play().catch(
        ()=>{}
      );

    }

  }

  emptyMessage.style.display=
  "none";
}


/* =========================================================
   REMOVE PEER
   ========================================================= */

function removePeer(peerId){

  if(peers[peerId]){

    try{
      peers[peerId].close();
    }catch(e){}

    delete peers[peerId];

  }

  delete names[peerId];

  delete pendingCandidates[peerId];

  const tile =
  document.getElementById(
    "tile-"+peerId
  );

  if(tile){
    tile.remove();
  }

  if(
    videoGrid.children.length===
    0
  ){

    emptyMessage.style.display=
    "block";

  }
}


/* =========================================================
   HELLO EVENT
   ========================================================= */

channel.on(
  "broadcast",
  {event:"hello"},
  async ({payload})=>{

    if(!payload)
      return;

    const peerId =
    payload.senderId;

    if(peerId===myId)
      return;

    names[peerId]=
    payload.sender;

    showToast(
      payload.sender+
      " joined the class"
    );

    /*
      Deterministic initiator:
      only one participant makes offer.
    */

    const initiator =
    myId < peerId;

    createPeer(
      peerId,
      payload.sender,
      initiator
    );

  }
);


/* =========================================================
   OFFER EVENT
   ========================================================= */

channel.on(
  "broadcast",
  {event:"offer"},
  async ({payload})=>{

    if(!payload)
      return;

    if(
      payload.targetId!==myId
    )
      return;

    const peerId =
    payload.senderId;

    const pc =
    createPeer(
      peerId,
      payload.sender,
      false
    );

    try{

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          payload.offer
        )
      );

      await addPendingCandidates(
        peerId,
        pc
      );

      const answer =
      await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      await channel.send({

        type:"broadcast",

        event:"answer",

        payload:{
          senderId:myId,
          targetId:peerId,
          answer:answer,
          sender:myName
        }

      });

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


/* =========================================================
   ANSWER EVENT
   ========================================================= */

channel.on(
  "broadcast",
  {event:"answer"},
  async ({payload})=>{

    if(!payload)
      return;

    if(
      payload.targetId!==myId
    )
      return;

    const pc =
    peers[payload.senderId];

    if(!pc)
      return;

    try{

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          payload.answer
        )
      );

      await addPendingCandidates(
        payload.senderId,
        pc
      );

    }catch(error){

      console.error(
        "Remote answer error:",
        error
      );

    }

  }
);


/* =========================================================
   ICE CANDIDATE
   ========================================================= */

channel.on(
  "broadcast",
  {event:"candidate"},
  async ({payload})=>{

    if(!payload)
      return;

    if(
      payload.targetId!==myId
    )
      return;

    const peerId =
    payload.senderId;

    const pc =
    peers[peerId];

    if(!pc){

      pendingCandidates[peerId] =
      pendingCandidates[peerId] || [];

      pendingCandidates[peerId]
      .push(payload.candidate);

      return;
    }

    try{

      if(
        pc.remoteDescription
      ){

        await pc.addIceCandidate(
          new RTCIceCandidate(
            payload.candidate
          )
        );

      }else{

        pendingCandidates[peerId] =
        pendingCandidates[peerId] || [];

        pendingCandidates[peerId]
        .push(payload.candidate);

      }

    }catch(error){

      console.error(
        "ICE error:",
        error
      );

    }

  }
);


/* =========================================================
   PENDING ICE
   ========================================================= */

async function addPendingCandidates(
  peerId,
  pc
){

  const list =
  pendingCandidates[peerId];

  if(!list ||
     !list.length)
    return;

  for(
    const candidate of list
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }catch(error){

      console.error(
        "Pending ICE error:",
        error
      );

    }

  }

  pendingCandidates[peerId]=[];

}


/* =========================================================
   CHAT EVENT
   ========================================================= */

channel.on(
  "broadcast",
  {event:"chat"},
  ({payload})=>{

    if(!payload)
      return;

    if(
      payload.senderId===myId
    )
      return;

    addMessage(
      payload.sender,
      payload.message
    );

  }
);


/* =========================================================
   PRESENCE
   ========================================================= */

channel.on(
  "presence",
  {event:"sync"},
  ()=>{

    const state =
    channel.presenceState();

    Object.keys(state)
    .forEach(key=>{

      const entries =
      state[key];

      if(!entries ||
         !entries.length)
        return;

      const info =
      entries[0];

      if(
        info.userId &&
        info.userId!==myId
      ){

        names[info.userId]=
        info.name || "Student";

        createPeer(
          info.userId,
          info.name || "Student",
          myId < info.userId
        );

      }

    });

  }
);


channel.on(
  "presence",
  {event:"join"},
  ({key,newPresences})=>{

    if(key===myId)
      return;

    if(
      !newPresences ||
      !newPresences.length
    )
      return;

    const info =
    newPresences[0];

    const peerId =
    info.userId || key;

    const peerName =
    info.name || "Student";

    if(peerId===myId)
      return;

    names[peerId]=
    peerName;

    showToast(
      peerName+
      " joined the class"
    );

    createPeer(
      peerId,
      peerName,
      myId < peerId
    );

  }
);


channel.on(
  "presence",
  {event:"leave"},
  ({key,leftPresences})=>{

    if(key===myId)
      return;

    const peerId =
    key;

    const peerName =
    names[peerId] ||
    "Student";

    removePeer(peerId);

    showToast(
      peerName+
      " left the class"
    );

  }
);


/* =========================================================
   CAMERA
   ========================================================= */

function toggleCamera(){

  if(!localStream)
    return;

  const track =
  localStream.getVideoTracks()[0];

  if(!track)
    return;

  cameraOn=
  !cameraOn;

  track.enabled=
  cameraOn;

  const btn =
  document.getElementById(
    "cameraBtn"
  );

  btn.classList.toggle(
    "off",
    !cameraOn
  );

  btn.dataset.tip=
    cameraOn
    ? "Camera"
    : "Camera Off";

  updateLocalStatus();
}


/* =========================================================
   MICROPHONE
   ========================================================= */

function toggleMic(){

  if(!localStream)
    return;

  const track =
  localStream.getAudioTracks()[0];

  if(!track)
    return;

  micOn=
  !micOn;

  track.enabled=
  micOn;

  const btn =
  document.getElementById(
    "micBtn"
  );

  btn.classList.toggle(
    "off",
    !micOn
  );

  btn.dataset.tip=
    micOn
    ? "Microphone"
    : "Microphone Muted";

  updateLocalStatus();
}


/* =========================================================
   LOCAL STATUS
   ========================================================= */

function updateLocalStatus(){

  const status =
  document.getElementById(
    "status-"+myId
  );

  if(!status)
    return;

  status.innerHTML=
    '<div class="status-icon">'+
    (micOn ? "🎤" : "🔇")+
    '</div>'+
    '<div class="status-icon">'+
    (cameraOn ? "🎥" : "📷")+
    '</div>';
}


/* =========================================================
   SCREEN SHARE
   ========================================================= */

async function toggleScreen(){

  if(!localStream)
    return;

  if(!screenOn){

    try{

      screenStream =
      await navigator
      .mediaDevices
      .getDisplayMedia({
        video:true
      });

      const screenTrack =
      screenStream
      .getVideoTracks()[0];

      for(
        const peerId in peers
      ){

        const sender =
        peers[peerId]
        .getSenders()
        .find(
          s=>
          s.track &&
          s.track.kind==="video"
        );

        if(sender){

          await sender.replaceTrack(
            screenTrack
          );

        }

      }

      const localVideo =
      document.querySelector(
        "#tile-"+myId+" video"
      );

      if(localVideo){

        localVideo.srcObject=
        screenStream;

      }

      screenOn=true;

      document
      .getElementById("screenBtn")
      .classList.add("active");

      document
      .getElementById("screenBtn")
      .dataset.tip=
      "Stop Screen Share";

      screenTrack.onended=
      ()=>{
        stopScreen();
      };

      showToast(
        "Screen sharing started"
      );

    }catch(error){

      console.log(
        "Screen share cancelled",
        error
      );

    }

  }else{

    stopScreen();

  }
}


/* =========================================================
   STOP SCREEN
   ========================================================= */

async function stopScreen(){

  if(!screenOn)
    return;

  const cameraTrack =
  localStream
  .getVideoTracks()[0];

  for(
    const peerId in peers
  ){

    const sender =
    peers[peerId]
    .getSenders()
    .find(
      s=>
      s.track &&
      s.track.kind==="video"
    );

    if(sender){

      await sender.replaceTrack(
        cameraTrack
      );

    }

  }

  if(screenStream){

    screenStream
    .getTracks()
    .forEach(track=>{
      track.stop();
    });

  }

  const localVideo =
  document.querySelector(
    "#tile-"+myId+" video"
  );

  if(localVideo){

    localVideo.srcObject=
    localStream;

  }

  screenOn=false;

  document
  .getElementById("screenBtn")
  .classList.remove("active");

  document
  .getElementById("screenBtn")
  .dataset.tip=
  "Screen Share";

  showToast(
    "Screen sharing stopped"
  );
}


/* =========================================================
   LEAVE CLASS
   ========================================================= */

async function leaveClass(){

  const answer =
  confirm(
    "Are you sure you want to leave the class?"
  );

  if(!answer)
    return;

  try{

    await channel.untrack();

  }catch(error){

    console.log(error);

  }

  for(
    const peerId in peers
  ){

    try{

      peers[peerId].close();

    }catch(e){}

  }

  Object.keys(peers)
  .forEach(
    key=>delete peers[key]
  );

  if(screenStream){

    screenStream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  }

  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track=>track.stop()
    );

  }

  try{

    await channel.unsubscribe();

  }catch(error){

    console.log(error);

  }

  joined=false;

  videoGrid.innerHTML="";

  emptyMessage.style.display=
  "block";

  document
  .getElementById("joinScreen")
  .style.display=
  "flex";

  document
  .getElementById("nameInput")
  .value="";

  showToast(
    "You left the class"
  );
}


/* =========================================================
   ENTER KEY ON NAME
   ========================================================= */

document
.getElementById("nameInput")
.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){
      joinClass();
    }

  }
);

</script>
